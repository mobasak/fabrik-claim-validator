# fabrik-managed — regenerate via fabrik scaffold; keep in sync with scripts/ci_local.sh.
name: CI
on:
  push:
  pull_request:
jobs:
  python:
    name: python (ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          pip install ruff==0.14.10 pytest pytest-asyncio
      - name: ruff (ratchet — lint debt may not grow)
        run: |
          n=$(ruff check . --exit-zero --output-format=json 2>/dev/null | python -c 'import sys,json;sys.stdout.write(str(len(json.load(sys.stdin))))' || echo 0)
          b=$(python -c "import sys,json;sys.stdout.write(str(json.load(open('.fabrik/lint-baseline.json'))['ruff_errors']))" 2>/dev/null || echo "$n")
          echo "ruff: $n errors (baseline $b)"
          [ "$n" -le "$b" ] || { echo "::error::ruff rose $b -> $n (new lint debt)"; exit 1; }
      - name: pytest
        run: python -m pytest -q || { c=$?; [ "$c" -eq 5 ] && echo "no tests collected — skipping" || exit "$c"; }
